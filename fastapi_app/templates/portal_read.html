{% extends "base.html" %}

{% block title %}Чтение - Конспекты{% endblock %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
    <div style="margin-bottom: 30px;">
        <a href="/" style="text-decoration: none; color: #3b82f6; display: inline-flex; align-items: center; gap: 8px; font-weight: 500;">
            <span>←</span> К списку конспектов
        </a>
    </div>
    
    <h1 id="read-title" style="font-size: 2.5em; color: #0f172a; margin-bottom: 8px;">Загрузка...</h1>
    <div style="color: #64748b; font-size: 0.9em; margin-bottom: 24px;">
        Опубликовано в Базе Знаний
    </div>

    <!-- Read-mode Toolbar -->
    <div class="portal-toolbar" style="display: flex; gap: 12px; margin-bottom: 30px; background: white; padding: 12px 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #e2e8f0; align-items: center; flex-wrap: wrap;">
        <!-- Local TOC -->
        <div class="dropdown-wrapper" style="position: relative;">
            <button class="portal-tool-btn" id="btn-portal-toc">📋 Оглавление</button>
            <div id="portal-toc-dropdown" class="dropdown-menu hidden" style="left: 0; right: auto; min-width: 300px; padding: 0; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white;">
                <div style="padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-weight: bold; display: flex; justify-content: space-between;">
                    <span>📋 Оглавление</span>
                    <button class="btn-close-dropdown" style="background: none; border: none; cursor: pointer; color: #94a3b8;">✕</button>
                </div>
                <div id="portal-toc-content" style="max-height: 300px; overflow-y: auto; padding: 8px;"></div>
            </div>
        </div>

        <!-- Local Search -->
        <div class="dropdown-wrapper" style="position: relative;">
            <button class="portal-tool-btn" id="btn-portal-search">🔍 Поиск по тексту</button>
            <div id="portal-search-dropdown" class="dropdown-menu hidden" style="left: 0; right: auto; min-width: 300px; padding: 12px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white;">
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px;">
                    <span>🔍 Поиск</span>
                    <button class="btn-close-dropdown" style="background: none; border: none; cursor: pointer; color: #94a3b8;">✕</button>
                </div>
                <input type="text" id="portal-search-input" placeholder="Искать в конспекте..." style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; margin-bottom: 8px;">
                <div id="portal-search-results" style="max-height: 250px; overflow-y: auto;"></div>
            </div>
        </div>

        <!-- Global Search -->
        <div class="dropdown-wrapper" style="position: relative;">
            <button class="portal-tool-btn" id="btn-portal-global-search">🌐 Глобальный поиск</button>
            <div id="portal-global-search-dropdown" class="dropdown-menu hidden" style="left: 0; right: auto; min-width: 350px; padding: 12px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white;">
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px;">
                    <span>🌐 Глобальный поиск</span>
                    <button class="btn-close-dropdown" style="background: none; border: none; cursor: pointer; color: #94a3b8;">✕</button>
                </div>
                <input type="text" id="portal-global-search-input" placeholder="Искать по всей базе знаний..." style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; margin-bottom: 8px;">
                <div id="portal-global-search-results" style="max-height: 250px; overflow-y: auto;"></div>
            </div>
        </div>

        <!-- Connections -->
        <button class="portal-tool-btn" id="btn-portal-connections">🔗 Связи</button>

        <!-- Formula Parser -->
        <button class="portal-tool-btn" id="btn-portal-formula-parser">🧮 Парсер формул</button>

        <!-- Evaluation Mock -->
        <button class="portal-tool-btn" id="btn-portal-evaluate" style="background: #fdfbf7; border-color: #fde68a; font-weight: 600;">⭐️ Оценить конспект</button>

        <div style="flex-grow: 1;"></div>

        <!-- Language Switch -->
        <div class="dropdown-wrapper" style="position: relative;">
            <button class="portal-tool-btn" id="btn-portal-lang">🌐 Язык</button>
            <div id="portal-lang-dropdown" class="dropdown-menu hidden" style="right: 0; left: auto; min-width: 120px; padding: 8px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white;">
                <div class="lang-option" data-lang="ru" style="padding: 8px; cursor: pointer; border-radius: 6px;">🇷🇺 Русский</div>
                <div class="lang-option" data-lang="en" style="padding: 8px; cursor: pointer; border-radius: 6px;">🇬🇧 English</div>
                <div class="lang-option" data-lang="kz" style="padding: 8px; cursor: pointer; border-radius: 6px;">🇰🇿 Қазақша</div>
            </div>
        </div>
    </div>
    
    <div class="canvas-area" style="margin-top: 10px; padding: 0;">
        <div id="read-content" class="dialectics-canvas">
            <!-- content -->
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8fafc;
    }
    .dialectics-block {
        pointer-events: none; /* Make read-only */
    }
    .dialectics-block .block-content {
        pointer-events: auto; /* Allow text selection inside */
    }
    .portal-tool-btn {
        background: white;
        border: 1px solid #e2e8f0;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        color: #475569;
        transition: background 0.2s;
    }
    .portal-tool-btn:hover {
        background: #f1f5f9;
    }
    .search-item:hover, .toc-item:hover, .lang-option:hover {
        background: #f1f5f9;
    }
</style>
{% endblock %}

{% block scripts %}
<script type="module">
    import NotesAPI from '/static/js/notes/api.js';

    async function loadNote() {
        const noteId = "{{ note_id }}";
        try {
            const note = await NotesAPI.getNote(noteId);
            document.getElementById('read-title').textContent = note.title || 'Без названия';
            document.title = (note.title || 'Чтение') + ' - Конспекты';

            const blocks = typeof note.content_json === 'string' ? JSON.parse(note.content_json) : note.content_json || [];
            
            const readyBlocks = blocks.filter(b => b.status === 'ready' || b.status === 'done');

            let anchorBlock = null;
            let nonAnchorBlocks = [];
            readyBlocks.forEach(b => {
                if (b.role === 'anchor') {
                    anchorBlock = b;
                } else {
                    nonAnchorBlocks.push(b);
                }
            });

            let orderedBlocks = [...nonAnchorBlocks];
            if (anchorBlock) {
                orderedBlocks.push(anchorBlock);
            }

            const html = orderedBlocks.map(b => {
                let blockHtml = b.html || '';
                
                if (b.role === 'section') {
                    return `<div class="dialectics-block block-section" data-id="${b.id}" style="border: none; background: transparent; box-shadow: none;">
                        <h2 style="margin-top: 20px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; color: #1e293b; text-align: center;">${b.title}</h2>
                    </div>`;
                }

                const side = b.side || 'left';
                let title = b.title ? `<h3 class="block-title" style="margin-top: 0; color: #1e293b; pointer-events: auto;">${b.title}</h3>` : '';
                
                const borderColorStyle = b.border_color ? `border-left-color: ${b.border_color} !important;` : '';

                return `<div class="dialectics-block block-${side}" data-id="${b.id}" style="${borderColorStyle}">
                    <div class="block-header" style="pointer-events: auto; justify-content: flex-start; gap: 10px; flex-direction: column; align-items: flex-start;">
                        ${title}
                    </div>
                    ${b.tags ? `
                    <div class="block-tags" style="padding: 0 0 12px 0; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto;">
                        ${b.tags.split(',').filter(t => t.trim()).map(t => `<span style="background: #e2e8f0; color: #475569; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 500;">#${t.trim()}</span>`).join('')}
                    </div>
                    ` : ''}
                    <div class="block-content" style="pointer-events: auto;">${blockHtml}</div>
                </div>`;
            }).join('');
            
            const contentEl = document.getElementById('read-content');
            if (html.trim() === '') {
                contentEl.innerHTML = '<p style="color: #64748b; font-style: italic;">Конспект пуст или не содержит завершенных блоков.</p>';
            } else {
                contentEl.innerHTML = html;
            }
            
            // Render Math
            import('/static/js/notes/BlockMathRenderer.js').then(module => {
                const BlockMathRenderer = module.default;
                BlockMathRenderer.renderMath(contentEl);
            }).catch(e => {
                console.error("Failed to load BlockMathRenderer", e);
            });
            
            // --- UI Toolbar Logic ---

            // Dropdown toggler
            document.querySelectorAll('.portal-tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const dropdown = btn.nextElementSibling;
                    if (dropdown && dropdown.classList.contains('dropdown-menu')) {
                        e.stopPropagation();
                        const isHidden = dropdown.classList.contains('hidden');
                        document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.add('hidden'));
                        if (isHidden) dropdown.classList.remove('hidden');
                    }
                });
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.dropdown-wrapper')) {
                    document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.add('hidden'));
                }
            });
            document.querySelectorAll('.btn-close-dropdown').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    btn.closest('.dropdown-menu').classList.add('hidden');
                });
            });

            // 1. Language
            document.querySelectorAll('.lang-option').forEach(el => {
                el.addEventListener('click', (e) => {
                    document.cookie = `locale=${e.target.dataset.lang}; path=/; max-age=31536000`;
                    window.location.reload();
                });
            });

            // 2. Parsers
            import('/static/js/notes/ParserWindowsManager.js').then(module => {
                const ParserWindowsManager = module.default;
                ParserWindowsManager.init();
                document.getElementById('btn-portal-formula-parser').addEventListener('click', () => {
                    ParserWindowsManager.openWindow('formula');
                });
            }).catch(e => console.error(e));

            // 3. TOC
            const tocContent = document.getElementById('portal-toc-content');
            tocContent.innerHTML = orderedBlocks.map(b => {
                const text = b.title || (b.role === 'section' ? '' : 'Что вам нужно понять?');
                return `<div class="toc-item" data-id="${b.id}" style="padding: 8px; cursor: pointer; border-radius: 6px; font-size: 0.9em; margin-bottom: 2px;">▪ ${text}</div>`;
            }).join('');
            tocContent.querySelectorAll('.toc-item').forEach(item => {
                item.addEventListener('click', () => {
                    const el = document.querySelector(`.dialectics-block[data-id="${item.dataset.id}"]`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            });

            // 4. Local Search
            const localSearchInput = document.getElementById('portal-search-input');
            const localSearchResults = document.getElementById('portal-search-results');
            localSearchInput.addEventListener('input', () => {
                const q = localSearchInput.value.toLowerCase();
                if (!q) { localSearchResults.innerHTML = ''; return; }
                const matches = orderedBlocks.filter(b => {
                    const text = (b.title || '') + ' ' + (b.html || '');
                    return text.toLowerCase().includes(q);
                });
                if (matches.length === 0) {
                    localSearchResults.innerHTML = '<div style="color: #64748b; font-size: 0.9em; padding: 8px;">Ничего не найдено</div>';
                    return;
                }
                localSearchResults.innerHTML = matches.map(b => `<div class="search-item" data-id="${b.id}" style="padding: 10px; cursor:pointer; border-bottom:1px solid #f1f5f9; font-size: 0.9em;"><b>${b.title || 'Блок'}</b></div>`).join('');
                localSearchResults.querySelectorAll('.search-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const el = document.querySelector(`.dialectics-block[data-id="${item.dataset.id}"]`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    });
                });
            });

            // 5. Global Search
            const globalSearchInput = document.getElementById('portal-global-search-input');
            const globalSearchResults = document.getElementById('portal-global-search-results');
            globalSearchInput.addEventListener('input', async () => {
                const q = globalSearchInput.value.trim();
                if (!q) { globalSearchResults.innerHTML = ''; return; }
                try {
                    const res = await fetch(`/api/notes?query=${encodeURIComponent(q)}`);
                    const notes = await res.json();
                    if (notes.length === 0) {
                        globalSearchResults.innerHTML = '<div style="color: #64748b; font-size: 0.9em; padding: 8px;">Ничего не найдено</div>';
                        return;
                    }
                    globalSearchResults.innerHTML = notes.map(n => `<a href="/read/${n.id}" class="search-item" style="display:block; padding: 10px; text-decoration:none; color:#1e293b; border-bottom:1px solid #f1f5f9; font-size: 0.9em;"><b>${n.title || 'Без названия'}</b></a>`).join('');
                } catch (e) {
                    console.error(e);
                }
            });

            // 6. Connections
            document.getElementById('btn-portal-connections').addEventListener('click', async () => {
                alert('Функция связей на портале в разработке!'); 
            });

            // 7. Evaluation Mock
            const btnEvaluate = document.getElementById('btn-portal-evaluate');
            if (btnEvaluate) {
                btnEvaluate.addEventListener('click', async () => {
                    const originalText = btnEvaluate.textContent;
                    btnEvaluate.textContent = '⏳ Оцениваем...';
                    btnEvaluate.disabled = true;
                    try {
                        const res = await fetch(\`/api/dialectics/\${noteId}/evaluate\`, { method: 'POST' });
                        if (!res.ok) throw new Error('Ошибка API');
                        const data = await res.json();
                        alert(\`Оценка: \${data.score}/100\\n\\n\${data.feedback}\`);
                    } catch (e) {
                        alert('Не удалось получить оценку.');
                    } finally {
                        btnEvaluate.textContent = originalText;
                        btnEvaluate.disabled = false;
                    }
                });
            }

        } catch (e) {
            console.error(e);
            document.getElementById('read-title').textContent = 'Ошибка загрузки';
            document.getElementById('read-content').innerHTML = '<p style="color: #ef4444;">Не удалось загрузить конспект. Возможно, он был удален.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadNote);
</script>
{% endblock %}
