name: Verify and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          npm ci
          sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer" node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome --install-deps
      - name: Build and verify
        run: |
          npm run build
          npm run lint
          npm run check:types
          npm run check:js
          npm test
          python -m pip check
          python -m pytest -q -p no:cacheprovider
          npm run test:browser
      - name: Audit all locked dependencies
        run: |
          python scripts/audit_dependencies.py
          npm audit --audit-level=low
      - name: Package the tested revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/build_release.py --sha "$RELEASE_SHA" --output .cache/release.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            .cache/release.tar.gz
            .cache/release.tar.gz.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAPANDA_RELEASES_READY == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: papanda-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: artifact
      - name: Deploy verified archive
        env:
          RELEASE_SHA: ${{ github.sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          digest=$(cat artifact/release.tar.gz.sha256)
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          destination="$SERVER_USER@$SERVER_HOST"
          incoming="/opt/papanda/incoming/$RELEASE_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "mkdir -p '$incoming'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes artifact/release.tar.gz scripts/deploy_release.py scripts/release_common.py "$destination:$incoming/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "python3.12 '$incoming/deploy_release.py' --root /opt/papanda --archive '$incoming/release.tar.gz' --sha '$RELEASE_SHA' --sha256 '$digest'"
