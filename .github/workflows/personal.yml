name: Build Papanda Personal for Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified ZIP to GitHub Releases
        type: boolean
        default: true
  push:
    tags: ['personal-v*']

permissions:
  contents: read

jobs:
  personal:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Validate the personal release version
        run: python scripts/publish_personal.py --check
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes -r requirements.txt
          .venv/Scripts/python -m pip install --target .cache/personal-build-tools pyinstaller==6.22.3
          npm ci --ignore-scripts
          npm run build
      - name: Build personal edition without deployment credentials
        run: .venv/Scripts/python scripts/build_personal.py --tools .cache/personal-build-tools
      - name: Verify the standalone executable with disposable data
        run: .venv/Scripts/python scripts/smoke_personal.py output/personal/Papanda-Personal/Papanda.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Papanda-Personal-Windows-x64
          path: |
            output/personal/*.zip
            output/personal/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: personal
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: papanda-personal-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Papanda-Personal-Windows-x64
          path: output/personal
      - name: Publish the verified Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_personal.py
